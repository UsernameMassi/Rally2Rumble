<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password | Rally2Rumble Sponsor Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="java/theme.js"></script>
</head>
<body data-page="login">
<div class="stripe"></div>
<header><a class="brand" href="index.html">Rally<b>2</b>Rumble</a><div class="row" id="nav"></div></header>
<main>
<form id="f">
  <div class="logo-ph">logo placeholder</div>
  <h2>Sponsor Assistant</h2>
  <p class="mute"><b>Forgot your password?</b></p>
  <p>Enter your email and we will send you a link to choose a new one.</p>
  <label for="e">Email</label><input id="e" type="email" required>
  <button>Send reset link</button><div class="msg" id="m"></div>
  <p><a class="link" href="login.html">Back to log in</a></p>
</form>
</main>
<script src="java/auth.js"></script>
<script src="java/java.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var m = document.getElementById('m'), b = ev.target.querySelector('button');
  b.disabled = true; m.textContent = 'Sending\u2026';
  R2R_AUTH.forgot(document.getElementById('e').value.trim()).then(function () {
    m.textContent = 'If that email has an account, a reset link is on its way. Check your spam folder too.';
  }, function (e) { m.textContent = e.message; }).then(function () { b.disabled = false; });
});
</script>
</body>
</html>
