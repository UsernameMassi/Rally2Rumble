<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Community | Rally2Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/info.css">
<link rel="stylesheet" href="css/blueprint.css">
<script src="java/theme.js"></script>
<style>
.join{max-width:560px;margin:0 auto}
.join h1{font-size:clamp(44px,9vw,76px);font-weight:800}
.join .lead{margin:14px 0 6px}
.join form{max-width:none;margin:22px 0 0}
.langs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.req{color:var(--accent)}
.hint{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.cb{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:18px}
.cb input{width:auto;margin-top:5px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{border-top:6px solid var(--accent);background:var(--panel);border:1px solid var(--line);padding:26px;margin-top:22px}
.done h2{font-size:34px;margin-bottom:10px}
</style>
</head>
<body>
<div class="stripe"></div>
<header><a class="brand" href="index.html">Rally<b>2</b>Rumble</a>
<nav class="nav2"><a href="index.html">Info</a><a href="route.html">Route</a><a href="agenda.html">Agenda</a><a href="gallery.html">Photos</a><a href="community.html" class="on">Community</a></nav>
<div class="row" id="nav"></div></header>
<main>
<div class="join">
<div class="langs" role="group" aria-label="Taal / Sprache / Language / Langue">
<button type="button" class="chip" data-l="nl" lang="nl">Nederlands</button>
<button type="button" class="chip" data-l="de" lang="de">Deutsch</button>
<button type="button" class="chip" data-l="en" lang="en">English</button>
<button type="button" class="chip" data-l="fr" lang="fr">Fran&ccedil;ais</button>
</div>
<h1>Join the Community</h1>
<p class="lead" data-i="lead"></p>

<form id="f" novalidate>
<h2 data-i="form"></h2>
<p class="hint" style="margin:-8px 0 8px"><span class="req">*</span> <span data-i="req"></span></p>

<label for="name"><span data-i="name"></span> <span class="req">*</span></label>
<input id="name" name="name" autocomplete="name" required minlength="2" maxlength="120">

<label for="car"><span data-i="car"></span> <span class="req">*</span></label>
<input id="car" name="car" autocomplete="off" required minlength="2" maxlength="160" data-ph="car_ph">

<label for="email"><span data-i="email"></span> <span class="req">*</span></label>
<input id="email" name="email" type="email" autocomplete="email" required maxlength="200">

<label for="phone"><span data-i="phone"></span> <span class="req">*</span></label>
<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="30" placeholder="06 12345678">

<div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>

<label class="cb"><input type="checkbox" id="consent" required><span><span data-i="consent"></span> <span class="req">*</span></span></label>

<button type="submit" id="go"></button>
<div class="msg" id="msg" role="alert" aria-live="polite"></div>
</form>

<div class="done" id="ok" hidden>
<h2 data-i="ok_h"></h2>
<p data-i="ok_p"></p>
<a class="btn ghost block" href="index.html" data-i="back"></a>
</div>
</div>
</main>
<script>

  var T = {

      go: "Word lid", going: "Even geduld\u2026", ok_h: "Welkom in de community", ok_p: "Bedankt, je staat op de lijst. Je hoort van ons via e-mail zodra er een nieuwe rally of een evenement aankomt.", back: 'Terug naar de rally-info',

      form: "Mitglied werden", req: 'Pflichtfeld', name: 'Vor- und Nachname', car: 'Aktueller Sportwagen oder Klassiker + Kennzeichen', car_ph: 'z. B. Porsche 911 (964), AB-123-C', email: 'E-Mail-Adresse', phone: 'Telefonnummer',
      consent: 'Ich bin damit einverstanden, dass Rally2Rumble meine Daten verwendet, um mich \u00fcber Rallyes und Events zu informieren. Meine Daten werden nicht an Dritte weitergegeben.',
      go: "Mitglied werden", going: "Einen Moment\u2026", ok_h: "Willkommen in der Community", ok_p: "Danke, du stehst auf der Liste. Wir melden uns per E-Mail, sobald eine neue Rallye oder ein Event ansteht.", back: 'Zur\u00fcck zur Rally-Info',

  var f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go'), ok = document.getElementById('ok');
  function all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }
  function apply() {
    var t = T[lang];
    document.documentElement.lang = lang;
    all('[data-i]').forEach(function (n) { n.textContent = t[n.getAttribute('data-i')]; });

    all('.langs button').forEach(function (b) { var on = b.getAttribute('data-l') === lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    go.textContent = busy ? t.going : t.go;
    msg.textContent = msgKey ? t[msgKey] : '';
  }
  function say(k) { msgKey = k; msg.textContent = k ? T[lang][k] : ''; }
  all('.langs button').forEach(function (b) { b.addEventListener('click', function () {

      headers: { 'Content-Type': 'application/json', apikey: SBK, Authorization: 'Bearer ' + SBK, Prefer: 'return=minimal' },

</body>
</html>
