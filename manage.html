<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally details | Rally2Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/mobile.css">
<script src="java/theme.js"></script>
<script src="java/i18n.js"></script>
<script src="java/translations.js"></script>
<script src="java/mobile.js"></script>
<style>
.rowed{display:grid;gap:8px;align-items:center}
.rowed.e-stop{grid-template-columns:34px 1fr 2fr 80px 80px auto}
.rowed.e-step{grid-template-columns:140px 1fr 80px auto}
.lt{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--onaccent)}
.rowed.e-agenda{grid-template-columns:90px 1fr 2fr auto}
.mv{display:flex;gap:4px}
@media(max-width:820px){.rowed.e-stop,.rowed.e-step,.rowed.e-agenda{grid-template-columns:1fr}}
</style>
</head>
<body data-page="manage">
<div class="stripe"></div>
<div class="app"><aside id="side"></aside><main id="view"></main></div>
<script src="java/rally-data.js"></script>
<script src="java/rally.js"></script>
<script src="java/java.js"></script>
<script src="java/manage.js"></script>
</body>
</html>
