<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password | Rally2Rumble Sponsor Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme.css">
<script src="java/theme.js"></script>
</head>
<body data-page="login">
<div class="stripe"></div>
<header><a class="brand" href="index.html">Rally<b>2</b>Rumble</a><div class="row" id="nav"></div></header>
<main>
<form id="f">
  <div class="logo-ph">logo placeholder</div>
  <h2>Sponsor Assistant</h2>
  <p class="mute"><b>Choose a new password</b></p>
  <label for="pw">New password</label><input id="pw" type="password" minlength="6" required autocomplete="new-password">
  <label for="pw2">Repeat password</label><input id="pw2" type="password" minlength="6" required autocomplete="new-password">
  <button>Save password</button><div class="msg" id="m"></div>
  <p><a class="link" href="forgot.html">Request a new link</a></p>
</form>
</main>
<script src="java/auth.js"></script>
<script src="java/java.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var m = document.getElementById('m'), b = ev.target.querySelector('button'), a = document.getElementById('pw').value;
  if (a !== document.getElementById('pw2').value) { m.textContent = 'The two passwords do not match.'; return; }
  b.disabled = true; m.textContent = 'Saving\u2026';
  R2R_AUTH.reset(a).then(function () {
    m.textContent = 'Password changed. Taking you to log in\u2026';
    setTimeout(function () { location.href = 'login.html'; }, 1500);
  }, function (e) { m.textContent = e.message; b.disabled = false; });
});
</script>
</body>
</html>
